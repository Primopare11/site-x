name: Nuove lezioni → coda Buffer per X
on:
  schedule: [{ cron: "17 */3 * * *" }]    # ogni 3 ore, al minuto 17
  workflow_dispatch:
    inputs:
      ultime: { description: "Tratta come nuove le ultime N lezioni (0 = solo le davvero nuove)", default: "0" }
permissions: { contents: write }
concurrency: lezioni
jobs:
  giro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 lezioni_x.py --ultime "${{ inputs.ultime || 0 }}"
        env: { VIDEO_URL_BASE: "${{ vars.VIDEO_URL_BASE }}" }
      - name: Salva stato e video
        run: |
          git config user.name "lezioni-x"; git config user.email "lezioni-x@users.noreply.github.com"
          git add stato video; git diff --cached --quiet || { git commit -m "Nuove lezioni"; git push; }
      - name: Post in coda su Buffer
        env: { BUFFER_TOKEN: "${{ secrets.BUFFER_TOKEN }}", BUFFER_CHANNEL_ID: "${{ vars.BUFFER_CHANNEL_ID }}" }
        run: python3 lezioni_x.py --buffer

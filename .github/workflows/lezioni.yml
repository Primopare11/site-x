name: Nuove lezioni → bozze per X
on:
  schedule: [{ cron: "17 */3 * * *" }]    # ogni 3 ore, al minuto 17
  workflow_dispatch:
permissions: { contents: write, issues: write }
concurrency: lezioni
jobs:
  giro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 lezioni_x.py
      - name: Salva stato e video
        run: |
          git config user.name "lezioni-x"; git config user.email "lezioni-x@users.noreply.github.com"
          git add stato video; git diff --cached --quiet || { git commit -m "Nuove lezioni"; git push; }
      - name: Una issue per ogni lezione nuova
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for f in uscita/*.md; do [ -e "$f" ] || continue
            n="${f%.md}"; gh issue create --title "$(cat "$n.titolo.txt")" --body-file "$f"
          done

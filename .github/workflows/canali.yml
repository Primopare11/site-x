name: Canali Buffer
on: workflow_dispatch
jobs:
  canali:
    runs-on: ubuntu-latest
    steps:
      - env: { BUFFER_TOKEN: "${{ secrets.BUFFER_TOKEN }}" }
        run: |
          q() { curl -s https://api.buffer.com -H "Content-Type: application/json" -H "Authorization: Bearer $BUFFER_TOKEN" -d "$1"; }
          ORG=$(q '{"query":"query { account { organizations { id } } }"}' | jq -r '.data.account.organizations[0].id')
          echo "organizzazione: $ORG"
          q "{\"query\":\"query { channels(input: {organizationId: \\\"$ORG\\\"}) { id name service } }\"}"
